[package]
name = "cameo"
version = "0.1.0"
description = "CAMEO AI — Cognitive Autonomous Machine Executive Operator"
authors = ["CAMEO AI"]
edition = "2024"

[lib]
name = "cameo_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "socks", "blocking"] }
sha2 = "0.10"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
